name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Если Pages ещё не включён в настройках репозитория, шаг не сработает —
      # тогда включи вручную: Settings → Pages → Source: GitHub Actions.
      - name: Включить Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Отключить Jekyll
        run: touch public/.nojekyll

      - name: Собрать сайт из public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
